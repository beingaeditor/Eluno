plugins { id 'com.android.application' }
android {
    namespace 'app.eluno.mobile'
    compileSdk 36
    defaultConfig { applicationId 'app.eluno.mobile'; minSdk 31; targetSdk 36; versionCode 2; versionName '0.2.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (System.getenv('ELUNO_ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('ELUNO_ANDROID_KEYSTORE'))
                storePassword System.getenv('ELUNO_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('ELUNO_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ELUNO_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { minifyEnabled false; if (System.getenv('ELUNO_ANDROID_KEYSTORE')) signingConfig signingConfigs.release } }
}
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-ui:1.8.0'
    implementation 'androidx.media3:media3-datasource-okhttp:1.8.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    testImplementation 'junit:junit:4.13.2'
}
